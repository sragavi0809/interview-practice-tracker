
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Interview Practice Tracker
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: #111827;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .brand h2 {
            margin: 0;
            font-size: 20px;
        }

        .brand p {
            margin: 3px 0 0;
            color: #6b7280;
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #111827;
        }

        .logout {
            background: #111827;
            color: white !important;
            padding: 9px 17px;
            border-radius: 7px;
        }

        /* =========================
           MOBILE NAVBAR
        ========================= */

        @media (max-width: 950px) {

            .nav-links {
                gap: 12px;
            }

        }

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         COMMON NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="brand">

            <div class="brand-icon">
                🧠
            </div>

            <div>

                <h2>
                    Interview Practice Tracker
                </h2>

                <p>
                    Build confidence. Practice smarter.
                </p>

            </div>

        </div>


        <div class="nav-links">

            <a href="{% url 'home' %}">
                🏠 Dashboard
            </a>

            <a href="{% url 'question_list' %}">
                📚 Question Bank
            </a>

            <a href="{% url 'practice' %}">
                🎯 Daily Practice
            </a>

            <a href="{% url 'practice_history' %}">
                📅 History
            </a>

            <a href="{% url 'logout' %}" class="logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         PAGE CONTENT
    ========================= -->

    {% block content %}
    {% endblock %}


</body>

</html>
